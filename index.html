<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabin Montaj Görüntüleyici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: tam ekran 3B görünüm; solda parça ağacı, sağ üstte bağlam kartı, altta araç şeridi, solda görünüm rayı */
:root{
  --bg:#dde3e5; --bg2:#eef2f3; --panel:#fbfcfc; --panel2:#f1f4f5; --line:#cbd3d6; --fg:#16232a; --mut:#5a6a71;
  --accent:#0b6e75; --accent-fg:#ffffff; --accent-soft:#d5ebec; --cut:#c2412d; --dim:#b85e00; --edge:#1c282e; --shadow:0 6px 24px rgba(20,40,48,.14);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --hit:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191d; --bg2:#1b252a; --panel:#1d272c; --panel2:#243036; --line:#33434b; --fg:#e3ebee; --mut:#93a5ad;
  --accent:#3fb4ba; --accent-fg:#05191b; --accent-soft:#16383b; --cut:#e2674f; --dim:#f0a23c; --edge:#0a1013; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191d; --bg2:#1b252a; --panel:#1d272c; --panel2:#243036; --line:#33434b; --fg:#e3ebee; --mut:#93a5ad;
  --accent:#3fb4ba; --accent-fg:#05191b; --accent-soft:#16383b; --cut:#e2674f; --dim:#f0a23c; --edge:#0a1013; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* üst çubuk */
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 12px/1 var(--f-mono);flex:none}
.brand h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.file{font:12px/1.2 var(--f-mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.file b{color:var(--fg);font-weight:500}
.spacer{flex:1}
.btn{height:var(--hit);min-width:var(--hit);padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:500}
.btn svg{width:18px;height:18px;flex:none}
.btn.icon{padding:0}

/* gövde */
.main{position:relative;min-height:0;display:flex}
.drawer{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin .2s}
.drawer.closed{margin-left:-300px}
.dhead{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.dhead .lbl{display:flex;justify-content:space-between;align-items:baseline}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.count{font:12px var(--f-mono);color:var(--mut)}
.search{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;width:100%;box-sizing:border-box}
.tree{overflow:auto;flex:1;padding:6px 0 90px;overscroll-behavior:contain}
.row{display:flex;align-items:center;min-height:40px;padding-left:calc(6px + var(--d,0) * 16px);padding-right:8px;gap:2px;border-left:3px solid transparent}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.row .tw,.row .eye{width:34px;height:36px;border:0;background:none;display:grid;place-items:center;color:var(--mut);flex:none;border-radius:6px}
.row .tw svg{width:14px;height:14px;transition:transform .15s}
.row .tw.open svg{transform:rotate(90deg)}
.row .tw.none{visibility:hidden}
.row .eye svg{width:18px;height:18px}
.row .eye.off{color:var(--line)}
.row .eye.part{color:var(--dim)}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 4px;cursor:pointer}
.row.dim .nm{color:var(--mut)}
.row .ct{font:11px var(--f-mono);color:var(--mut)}
.kids[hidden]{display:none}

.view{position:relative;flex:1;min-width:0;background:radial-gradient(120% 90% at 50% 35%,var(--bg2),var(--bg));touch-action:none;overflow:hidden}
.view canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ov-l{stroke:var(--dim);stroke-width:2.5}.ov-p{stroke:var(--dim);stroke-width:2;stroke-opacity:.6}.ov-x{stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 4;stroke-opacity:.8}.mlabel.ghost{opacity:.75}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel2);border-radius:10px;padding:4px}.seg button{min-height:40px;border:0;border-radius:7px;background:none;font-size:12px;font-weight:500;padding:4px}.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.18);color:var(--accent)}.tg{font-size:12px;color:var(--dim);margin-right:2px}.ov-d{fill:var(--dim);stroke:#fff;stroke-width:1.5}.ov-r{fill:none;stroke:var(--dim);stroke-width:2.5}.ov-c{fill:var(--dim)}
.mlabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:var(--dim);color:#fff;font:500 13px/1 var(--f-mono);padding:5px 7px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mlabel small{opacity:.8;font-weight:400;margin-left:4px}

/* görünüm rayı */
.rail{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}
.rail button{width:var(--hit);height:40px;border:0;background:none;border-radius:8px;font:500 11px/1 var(--f-ui);color:var(--fg);display:grid;place-items:center}
.rail button:hover{background:var(--panel2)}
.rail button.on{background:var(--accent);color:var(--accent-fg)}
.rail button svg{width:20px;height:20px}
.rail hr{border:0;border-top:1px solid var(--line);margin:2px 4px}

/* bağlam kartı */
.card{position:absolute;right:12px;top:12px;width:300px;max-height:calc(100% - 110px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.card h2{font-size:16px;margin:0;font-weight:600;overflow-wrap:anywhere;text-wrap:balance}
.card .path{font:11px/1.4 var(--f-mono);color:var(--mut);overflow-wrap:anywhere}
.card .hint{color:var(--mut);line-height:1.5;margin:0}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dims div{background:var(--panel2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:3px}
.dims span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.dims b{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{padding:0 10px;font-size:13px;justify-content:flex-start}
.acts .btn.on{background:var(--accent-soft);border-color:var(--accent)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.kv b{font:500 13px var(--f-mono);color:var(--fg)}

.sec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.sec .ax{width:var(--hit);height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:600 14px var(--f-mono)}
.sec .ax.on{background:var(--cut);color:#fff;border-color:transparent}
.sec input[type=range]{width:100%;accent-color:var(--cut);height:32px}
.sec .fl{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center}
.sec .fl svg{width:18px;height:18px}
.sec .val{grid-column:2/4;font:12px var(--f-mono);color:var(--mut);margin-top:-6px}
.sec.off input,.sec.off .fl,.sec.off .val{opacity:.4}

.mlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.mlist li{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:6px 6px 6px 10px}
.mlist .n{font:11px var(--f-mono);color:var(--mut);width:18px}
.mlist .v{flex:1;min-width:0}
.mlist .v b{font:500 15px var(--f-mono);display:block}
.mlist .v small{font:11px var(--f-mono);color:var(--mut)}
.mlist button{width:36px;height:36px;border:0;background:none;border-radius:6px;color:var(--mut)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 label{font-size:13px;color:var(--mut)}
select{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* alt araç şeridi */
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto}
.dock button{min-width:64px;height:52px;border:0;background:none;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--fg);flex:none;padding:0 8px}
.dock button svg{width:20px;height:20px}
.dock button:hover{background:var(--panel2)}
.dock button.on{background:var(--accent);color:var(--accent-fg)}
.dock .sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
.dock button:disabled{opacity:.35;cursor:default}

.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;max-width:min(520px,calc(100% - 32px));box-shadow:var(--shadow);line-height:1.4}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent-soft) 70%,transparent);display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.busybox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 18px;box-shadow:var(--shadow);font:13px var(--f-mono);display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .top{padding:6px 12px;gap:8px}
  .brand h1,.top .hide-s{display:none}
  .drawer{position:absolute;inset:0 auto 0 0;z-index:5;box-shadow:var(--shadow);width:min(300px,85%)}
  .drawer.closed{margin-left:-320px}
  .card{left:12px;right:12px;width:auto;top:auto;bottom:82px;max-height:42%}
  .rail{flex-direction:row;flex-wrap:wrap;max-width:calc(100% - 24px)}
  .rail hr{border-top:0;border-left:1px solid var(--line);margin:4px 2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="btn icon" id="btnTree" title="Parça ağacı" aria-label="Parça ağacını aç/kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
    <div class="brand"><div class="mark">3B</div><h1>Kabin Montaj Görüntüleyici</h1></div>
    <div class="file" id="fileInfo"></div>
    <div class="spacer"></div>
    <label class="btn primary" for="fileIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0l-4 4m4-4l4 4M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg><span>Model aç</span></label>
    <input type="file" id="fileIn" accept=".glb,.gltf,.bin,.png,.jpg,.jpeg" multiple hidden>
  </header>

  <div class="main">
    <aside class="drawer" id="drawer">
      <div class="dhead">
        <div class="lbl">Parçalar <span class="count" id="treeCount"></span></div>
        <input class="search" id="search" type="search" placeholder="Parça ara (ör. kapak, raf)">
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <section class="view" id="view">
      <div class="overlay" id="overlay"><svg id="ovSvg"></svg><div class="mlabel ghost" id="hoverLbl" hidden></div></div>

      <nav class="rail" aria-label="Görünümler">
        <button data-view="fit" title="Ekrana sığdır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button data-view="iso" title="İzometrik">İZO</button>
        <button data-view="front" title="Önden">ÖN</button>
        <button data-view="top" title="Üstten">ÜST</button>
        <button data-view="right" title="Sağdan">SAĞ</button>
        <button data-view="left" title="Soldan">SOL</button>
        <button data-view="back" title="Arkadan">ARK</button>
        <hr>
        <button id="btnOrtho" title="Ortografik / perspektif">ORT</button>
        <button id="btnEdges" title="Kenar çizgileri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zm0 0v18M4 7.5l8 4.5 8-4.5"/></svg></button>
      </nav>

      <div class="card" id="card"></div>

      <div class="dock" role="toolbar" aria-label="Araçlar">
        <button data-mode="select" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 8-6 2-3 6-5-16z"/></svg>Seç</button>
        <button data-mode="measure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21l-4-4zM7 13l2 2M10 10l2 2M13 7l2 2"/></svg>Ölç</button>
        <button data-mode="section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l8-4 8 4v10l-8 4-8-4V7z" opacity=".45"/><path d="M2 12h20" stroke-dasharray="3 2"/></svg>Kesit</button>
        <span class="sep"></span>
        <button id="btnShowAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Tümü</button>
        <button id="btnUndo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Geri al</button>
      </div>

      <div class="toast" id="toast" hidden></div>
      <div class="drop" id="drop" hidden>GLB dosyasını bırakın</div>
      <div class="busy" id="busy" hidden><div class="busybox"><span id="busyTxt">Yükleniyor…</span><button class="btn" id="busyCancel" hidden>İptal</button></div></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const V3=THREE.Vector3;
const ICON={
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6 0 10 7 10 7a17 17 0 01-3.2 3.9M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7a9.6 9.6 0 005.4-1.6"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>',
  flip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- durum ---------- */
const S={
  root:null, rootItem:null, items:[], meshes:[], sel:null, mode:'select', ghost:false, edges:false,
  unitScale:1000, unitName:'m', snap:true, measures:[], pending:null, hover:null, hist:[], mtype:'auto',
  tris:0, blinkT0:0, blinkLoop:false,
  box:new THREE.Box3(), size:1, orthoH:4, fileLabel:'',
  sec:{x:{on:false,v:500,flip:false},y:{on:false,v:500,flip:false},z:{on:false,v:500,flip:false}},
  planes:[] // aktif düzlemler (malzemelerle paylaşılan dizi)
};
const PLANES={x:new THREE.Plane(),y:new THREE.Plane(),z:new THREE.Plane()};
const CAP={capColor:{value:new THREE.Color('#c2412d')},capOn:{value:0}};
const HL=new THREE.Color();
let dirty=true;

/* ---------- renderer ---------- */
const view=$('#view');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.sortObjects=true;
renderer.localClippingEnabled=true;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.setClearColor(0x000000,0);
view.prepend(renderer.domElement);

const scene=new THREE.Scene();
const persp=new THREE.PerspectiveCamera(38,1,0.01,1000);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,-1000,1000);
let camera=persp;
scene.add(new THREE.HemisphereLight(0xffffff,0x7d878c,0.85));
const key=new THREE.DirectionalLight(0xffffff,0.75);scene.add(key);scene.add(key.target);
const fill=new THREE.DirectionalLight(0xffffff,0.25);fill.position.set(-1,0.4,-1);scene.add(fill);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.14;controls.screenSpacePanning=true;controls.rotateSpeed=0.8;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};

const secGuides=new THREE.Group();scene.add(secGuides);

function readTokens(){
  const cs=getComputedStyle(document.documentElement);
  const g=n=>cs.getPropertyValue(n).trim();
  CAP.capColor.value.set(g('--cut')||'#c2412d');
  HL.set(g('--accent')||'#0b6e75').multiplyScalar(0.75);
  edgeMat.color.set(g('--edge')||'#1c282e');
  guideMat.color.set(g('--cut')||'#c2412d');
  HL_MATS.forEach(v=>setHlLevel(v,1));
  dirty=true;
}
const edgeMat=new THREE.LineBasicMaterial({color:0x1c282e,transparent:true,opacity:0.55});
edgeMat.clippingPlanes=S.planes;
const guideMat=new THREE.LineBasicMaterial({color:0xc2412d,depthTest:false,transparent:true,opacity:0.9});

function resize(){
  const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);
  persp.aspect=w/h;persp.updateProjectionMatrix();updateOrtho();dirty=true;
}
function updateOrtho(){
  const a=persp.aspect||1,h=S.orthoH;
  ortho.left=-h*a/2;ortho.right=h*a/2;ortho.top=h/2;ortho.bottom=-h/2;
  ortho.near=-S.size*20;ortho.far=S.size*20;ortho.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

/* ---------- malzeme hazırlama (kesit dolgusu) ---------- */
// Aynı malzemeyi kullanan parçalar tek malzemeyi paylaşır (çizim hızı için).
// Seçili / saydam görünüm için ayrı varyantlar üretilir ve parçaya geçici atanır.
const MATS=new Set(),HL_MATS=new Set(),BASEINFO=new WeakMap(),VARIANTS=new WeakMap();
let matCache=new Map();
const ORIGSIDE=new WeakMap();
function hookMat(mat){
  if(!ORIGSIDE.has(mat))ORIGSIDE.set(mat,mat.side);
  mat.side=S.planes.length?THREE.DoubleSide:ORIGSIDE.get(mat);
  mat.clippingPlanes=S.planes;
  mat.onBeforeCompile=sh=>{
    sh.uniforms.capColor=CAP.capColor;sh.uniforms.capOn=CAP.capOn;
    sh.fragmentShader='uniform vec3 capColor;\nuniform float capOn;\n'+sh.fragmentShader.replace('#include <dithering_fragment>','#include <dithering_fragment>\nif(capOn>0.5 && !gl_FrontFacing){ gl_FragColor=vec4(capColor,1.0); }');
  };
  mat.customProgramCacheKey=()=>'kesitDolgu';
  MATS.add(mat);return mat;
}
function prepMat(m){
  let p=matCache.get(m);if(p)return p;
  p=hookMat(m.clone());
  BASEINFO.set(p,{color:p.color?p.color.clone():null,emissive:p.emissive?p.emissive.clone():null});
  VARIANTS.set(p,{});matCache.set(m,p);return p;
}
function variant(base,kind){
  const vs=VARIANTS.get(base);if(!vs)return base;
  if(vs[kind])return vs[kind];
  const v=base.clone();ORIGSIDE.set(v,ORIGSIDE.get(base));hookMat(v);BASEINFO.set(v,BASEINFO.get(base));
  if(kind==='ghost'){v.transparent=true;v.opacity=0.12;v.depthWrite=false;}
  if(kind==='hl'){HL_MATS.add(v);setHlLevel(v,1);}
  return vs[kind]=v;
}
function setHlLevel(v,f){
  const b=BASEINFO.get(v);if(!b)return;
  if(v.emissive&&b.emissive)v.emissive.copy(b.emissive).lerp(HL,f);
  else if(v.color&&b.color)v.color.copy(b.color).lerp(HL,0.55*f);
}
function setMeshKind(m,kind){
  const base=m.userData.baseMat;
  m.material=!kind?base:Array.isArray(base)?base.map(b=>variant(b,kind)):variant(base,kind);
}
const eachMat=(mesh,fn)=>{(Array.isArray(mesh.material)?mesh.material:[mesh.material]).forEach(fn);};
function allMats(fn){MATS.forEach(fn);}

/* ---------- model kurulumu ---------- */
function clearModel(){
  if(S.root){scene.remove(S.root);S.root.traverse(o=>{if(o.isMesh||o.isLineSegments)o.geometry.dispose();});}
  MATS.forEach(m=>m.dispose());MATS.clear();HL_MATS.clear();matCache=new Map();
  S.root=null;S.items=[];S.meshes=[];S.sel=null;S.hist=[];clearMeasures();
}
function setModel(root,label){
  clearModel();
  S.root=root;S.fileLabel=label;
  root.updateMatrixWorld(true);
  let tris=0;
  root.traverse(o=>{
    if(o.isMesh){
      const g=o.geometry;
      if(!g.attributes.normal)g.computeVertexNormals();
      o.material=Array.isArray(o.material)?o.material.map(prepMat):prepMat(o.material);
      o.userData.baseMat=o.material;
      if(!g.boundingBox)g.computeBoundingBox();
      o.userData.wbox=g.boundingBox.clone().applyMatrix4(o.matrixWorld);
      tris+=(g.index?g.index.count:g.attributes.position.count)/3;
      S.meshes.push(o);
    }
  });
  S.tris=tris;
  scene.add(root);
  buildItems(root);
  S.box.makeEmpty();S.meshes.forEach(m=>S.box.expandByObject(m));
  if(S.box.isEmpty())S.box.set(new V3(-1,-1,-1),new V3(1,1,1));
  S.size=S.box.getSize(new V3()).length()||1;
  persp.near=S.size/500;persp.far=S.size*40;persp.updateProjectionMatrix();
  controls.minDistance=S.size/200;controls.maxDistance=S.size*8;
  Object.values(S.sec).forEach(s=>{s.on=false;s.v=500;s.flip=false;});
  if(S.edges)buildEdges();
  updatePlanes();
  renderTree();
  $('#fileInfo').innerHTML=`<b>${esc(label)}</b> · ${countParts()} parça · ${fmtInt(tris)} üçgen`;
  setView('iso',true);
  renderCard();updateUndo();dirty=true;
}
function countParts(){return S.items.filter(i=>i.children.length===0).length;}

/* ---------- ağaç yapısı ---------- */
function markHasMesh(o){let h=!!o.isMesh;o.children.forEach(c=>{if(markHasMesh(c))h=true;});o.userData._hm=h;return h;}
function baseName(n){return (n||'').replace(/_\d+$/,'');}
function isLeafGroup(o){
  if(o.isMesh)return true;
  const k=o.children.filter(c=>c.userData._hm);
  if(!k.length)return true;
  if(!k.every(c=>c.isMesh&&!c.children.some(x=>x.userData._hm)))return false;
  if(k.length===1)return !k[0].name||baseName(k[0].name)===baseName(o.name);
  const b=baseName(k[0].name);return k.every(c=>!c.name||baseName(c.name)===b);
}
function buildItems(root){
  markHasMesh(root);
  S.items=[];
  const mk=(obj,parent,depth)=>{
    const it={obj,parent,depth,children:[],meshes:[],name:nice(obj)};
    obj.userData.ti=it;
    obj.traverse(x=>{if(x.isMesh)it.meshes.push(x);});
    if(parent)parent.children.push(it);
    S.items.push(it);
    return it;
  };
  const rec=(obj,parent,depth)=>{
    let kids=obj.children.filter(c=>c.userData._hm);
    // isimsiz tek-çocuklu sarmalayıcıları atla
    while(kids.length===1&&!kids[0].isMesh&&!kids[0].name){kids=kids[0].children.filter(c=>c.userData._hm);}
    kids.forEach(k=>{
      const it=mk(k,parent,depth);
      if(!isLeafGroup(k))rec(k,it,depth+1);
    });
  };
  S.rootItem={obj:root,parent:null,depth:0,children:[],meshes:S.meshes.slice(),name:'Model'};
  root.userData.ti=S.rootItem;
  rec(root,S.rootItem,1);
}
function nice(o){
  let n=o.name||(o.isMesh?'Gövde':'Grup');
  return n.replace(/_/g,' ').replace(/\s+/g,' ').trim();
}
function itemOf(obj){let o=obj;while(o){if(o.userData.ti)return o.userData.ti;o=o.parent;}return null;}
function isAncestor(a,b){let x=b;while(x){if(x===a)return true;x=x.parent;}return false;}

/* ---------- ağaç arayüzü ---------- */
const treeEl=$('#tree');let rowMap=new Map();
function renderTree(filter){
  treeEl.innerHTML='';rowMap=new Map();
  if(filter){
    const q=filter.toLocaleLowerCase('tr');
    const hits=S.items.filter(i=>i.name.toLocaleLowerCase('tr').includes(q)).slice(0,300);
    hits.forEach(it=>appendRow(treeEl,it,0,true));
    $('#treeCount').textContent=hits.length+' sonuç';
    if(!hits.length)treeEl.innerHTML='<p class="hint" style="padding:12px;color:var(--mut)">Eşleşen parça yok.</p>';
  }else{
    S.rootItem.children.forEach(it=>appendRow(treeEl,it,0));
    $('#treeCount').textContent=countParts()+' parça';
  }
  refreshRows();
}
function appendRow(container,it,depth,flat){
  const row=document.createElement('div');row.className='row';row.style.setProperty('--d',depth);
  const hasKids=!flat&&it.children.length>0;
  row.innerHTML=`<button class="tw ${hasKids?'':'none'}" aria-label="Aç/kapat">${ICON.chev}</button><button class="eye" aria-label="Görünürlük">${ICON.eye}</button><span class="nm"></span>${it.children.length?`<span class="ct">${it.children.length}</span>`:''}`;
  row.querySelector('.nm').textContent=it.name;
  row.querySelector('.nm').title=it.name;
  const kids=document.createElement('div');kids.className='kids';kids.hidden=true;
  container.append(row,kids);
  const rec={row,kids,open:false,depth,built:false};
  rowMap.set(it,rec);
  row.querySelector('.tw').onclick=()=>toggleRow(it);
  row.querySelector('.eye').onclick=()=>{pushHist();const on=visCount(it)<it.meshes.length;it.meshes.forEach(m=>m.visible=on);if(!on&&S.sel&&isAncestor(it.obj,S.sel.obj))select(null);afterVis();};
  row.querySelector('.nm').onclick=()=>{select(it);focusItem(it);if(window.innerWidth<=760)toggleDrawer(false);};
}
function toggleRow(it,force){
  const r=rowMap.get(it);if(!r)return;
  const open=force===undefined?!r.open:force;
  if(open&&!r.built){it.children.forEach(c=>appendRow(r.kids,c,r.depth+1));r.built=true;refreshRows();}
  r.open=open;r.kids.hidden=!open;r.row.querySelector('.tw').classList.toggle('open',open);
}
function visCount(it){let n=0;for(const m of it.meshes)if(m.visible)n++;return n;}
function refreshRows(){
  rowMap.forEach((r,it)=>{
    const n=visCount(it),t=it.meshes.length;
    const eye=r.row.querySelector('.eye');
    eye.className='eye'+(n===0?' off':n<t?' part':'');
    eye.innerHTML=n===0?ICON.eyeOff:ICON.eye;
    r.row.classList.toggle('dim',n===0);
    r.row.classList.toggle('sel',S.sel===it);
  });
}
function revealInTree(it){
  if(!it||$('#search').value)return;
  const chain=[];let p=it.parent;while(p&&p!==S.rootItem){chain.unshift(p);p=p.parent;}
  chain.forEach(c=>toggleRow(c,true));
  const r=rowMap.get(it);if(r)r.row.scrollIntoView({block:'nearest'});
}
$('#search').addEventListener('input',e=>renderTree(e.target.value.trim()));

/* ---------- seçim ---------- */
function select(it){
  S.sel=it||null;
  if(S.sel)S.blinkT0=performance.now();
  applyGhost();refreshRows();revealInTree(S.sel);
  if(S.mode==='select')renderCard();
  dirty=true;
}
function applyGhost(){
  if(!S.sel)S.ghost=false;
  const sel=S.sel?new Set(S.sel.meshes):null;
  S.meshes.forEach(m=>{
    const k=sel&&sel.has(m)?'hl':(S.ghost&&sel?'ghost':null);
    setMeshKind(m,k);m.userData.ghost=k==='ghost';m.renderOrder=k==='ghost'?2:0;
  });
  dirty=true;
}
// Seçilen mobilya yanıp söner: kısa modda 3 kez, sürekli modda seçim bırakılana kadar
function stepBlink(now){
  if(!S.sel||!S.blinkT0)return;
  const t=(now-S.blinkT0)/1000,per=0.42;
  let f;
  if(!S.blinkLoop&&t>=per*3){f=1;S.blinkT0=0;}
  else f=0.5+0.5*Math.cos(t/per*2*Math.PI);
  HL_MATS.forEach(v=>setHlLevel(v,f));dirty=true;
}
function itemBox(it){const b=new THREE.Box3();it.meshes.forEach(m=>b.expandByObject(m));return b;}

/* ---------- görünürlük ---------- */
function pushHist(){S.hist.push(S.meshes.map(m=>m.visible));if(S.hist.length>40)S.hist.shift();updateUndo();}
function undo(){const s=S.hist.pop();if(!s)return;S.meshes.forEach((m,i)=>m.visible=s[i]);afterVis();}
function updateUndo(){$('#btnUndo').disabled=!S.hist.length;}
function afterVis(){refreshRows();updateUndo();if(S.mode==='select')renderCard();if(S.edges)syncEdges();dirty=true;}
function hideItem(it){pushHist();it.meshes.forEach(m=>m.visible=false);select(null);afterVis();toast(`${it.name} gizlendi`);}
function isolate(it){pushHist();const k=new Set(it.meshes);S.meshes.forEach(m=>m.visible=k.has(m));afterVis();focusItem(it);}
function showAll(){if(S.meshes.every(m=>m.visible))return;pushHist();S.meshes.forEach(m=>m.visible=true);afterVis();}
function shown(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}

/* ---------- kenar çizgileri ---------- */
function buildEdges(){
  S.meshes.forEach(m=>{
    if(m.userData.edges)return;
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,28),edgeMat);
    e.raycast=()=>{};e.userData.isEdge=true;e.layers.mask=m.layers.mask;m.add(e);m.userData.edges=e;
  });
}
function syncEdges(){S.meshes.forEach(m=>{if(m.userData.edges)m.userData.edges.visible=S.edges;});dirty=true;}
$('#btnEdges').onclick=e=>{
  S.edges=!S.edges;e.currentTarget.classList.toggle('on',S.edges);
  if(S.edges&&S.meshes.some(m=>!m.userData.edges)){busy('Kenarlar hesaplanıyor…');setTimeout(()=>{buildEdges();syncEdges();busy();},30);}else syncEdges();
};

/* ---------- kesit ---------- */
const AX={x:new V3(1,0,0),y:new V3(0,1,0),z:new V3(0,0,1)};
function secPos(a){const s=S.sec[a];const lo=S.box.min[a],hi=S.box.max[a];return lo+(hi-lo)*(s.v/1000);}
function updatePlanes(){
  const before=S.planes.length;S.planes.length=0;
  secGuides.clear();
  ['x','y','z'].forEach(a=>{
    const s=S.sec[a];if(!s.on)return;
    const n=AX[a].clone().multiplyScalar(s.flip?1:-1);
    const p=AX[a].clone().multiplyScalar(secPos(a));
    PLANES[a].setFromNormalAndCoplanarPoint(n,p);
    S.planes.push(PLANES[a]);
    if(S.mode==='section')secGuides.add(guideFor(a,secPos(a)));
  });
  if(before!==S.planes.length){
    const dbl=S.planes.length>0;
    allMats(m=>{m.side=dbl?THREE.DoubleSide:ORIGSIDE.get(m);m.needsUpdate=true;});edgeMat.needsUpdate=true;
  }
  CAP.capOn.value=S.planes.length?1:0;
  cullClipped();
  dirty=true;
}
// Kesitin tamamen dışında kalan parçaları hiç çizme (katman 1'e taşı; ışın da onları görmez)
const _c=new V3(),_e=new V3();
function cullClipped(){
  S.meshes.forEach(m=>{
    let out=false;const b=m.userData.wbox;
    if(b&&S.planes.length){
      b.getCenter(_c);b.getSize(_e).multiplyScalar(0.5);
      for(const p of S.planes){const n=p.normal;
        if(n.dot(_c)+Math.abs(n.x)*_e.x+Math.abs(n.y)*_e.y+Math.abs(n.z)*_e.z+p.constant<0){out=true;break;}}
    }
    const mask=out?2:1;
    if(m.layers.mask!==mask){m.layers.mask=mask;if(m.userData.edges)m.userData.edges.layers.mask=mask;}
  });
}
function guideFor(a,v){
  const b=S.box.clone().expandByScalar(S.size*0.03),mn=b.min,mx=b.max,pts=[];
  if(a==='x')pts.push([v,mn.y,mn.z],[v,mx.y,mn.z],[v,mx.y,mx.z],[v,mn.y,mx.z]);
  if(a==='y')pts.push([mn.x,v,mn.z],[mx.x,v,mn.z],[mx.x,v,mx.z],[mn.x,v,mx.z]);
  if(a==='z')pts.push([mn.x,mn.y,v],[mx.x,mn.y,v],[mx.x,mx.y,v],[mn.x,mx.y,v]);
  const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new V3(...p)));
  const l=new THREE.LineLoop(g,guideMat);l.renderOrder=999;return l;
}
function isClipped(p){const tol=S.size*1e-6;for(const pl of S.planes)if(pl.distanceToPoint(p)<-tol)return true;return false;}

/* ---------- ölçü ---------- */
const ovSvg=$('#ovSvg'),overlay=$('#overlay');
const MTYPES={auto:'Dik (eksen)',normal:'Yüzeye dik',x:'Yalnız X',y:'Yalnız Y',z:'Yalnız Z',free:'Serbest'};
function clearMeasures(){S.measures.forEach(m=>m.label.remove());S.measures=[];S.pending=null;S.hover=null;drawOverlay();}
// İki noktadan ölçü üret: varsayılan, en baskın eksene paralel (90° dik) ölçüdür
function dimFrom(A,B){
  const d=B.p.clone().sub(A.p);
  if(S.mtype==='free')return {a:A.p.clone(),c:B.p.clone(),b:B.p.clone(),len:d.length(),tag:'∠'};
  let axis,tag;
  if(S.mtype==='normal'&&A.n){
    axis=A.n.clone().normalize();
    for(const k of ['x','y','z'])if(Math.abs(axis[k])>0.9995){axis=AX[k].clone().multiplyScalar(Math.sign(axis[k]));}
    tag='⊥';
  }else{
    const k=['x','y','z'].includes(S.mtype)?S.mtype:['x','y','z'].reduce((m,q)=>Math.abs(d[q])>Math.abs(d[m])?q:m,'x');
    axis=AX[k].clone();tag=k.toUpperCase();
  }
  const t=d.dot(axis);
  return {a:A.p.clone(),c:A.p.clone().addScaledVector(axis,t),b:B.p.clone(),len:Math.abs(t),tag};
}
function addMeasure(A,B){
  const label=document.createElement('div');label.className='mlabel';overlay.appendChild(label);
  S.measures.push(Object.assign(dimFrom(A,B),{label}));S.pending=null;S.hover=null;
  if(S.mode==='measure')renderCard();
}
function fmtLen(modelLen){
  const mm=modelLen*S.unitScale;
  return (Math.abs(mm)>=100?mm.toFixed(1):mm.toFixed(2)).replace('.',',');
}
function project(p){
  const v=p.clone().project(camera);
  const w=view.clientWidth,h=view.clientHeight;
  return {x:(v.x+1)/2*w,y:(1-v.y)/2*h,ok:v.z>-1&&v.z<1};
}
function dimSvg(m,cls){
  const A=project(m.a),C=project(m.c),B=project(m.b);
  if(!A.ok||!C.ok)return {svg:'',ok:false};
  let s='';
  const dx=C.x-A.x,dy=C.y-A.y,L=Math.hypot(dx,dy)||1,px=-dy/L*7,py=dx/L*7;
  if(B.ok&&Math.hypot(B.x-C.x,B.y-C.y)>2)s+=`<line class="ov-x" x1="${C.x}" y1="${C.y}" x2="${B.x}" y2="${B.y}"/><circle class="ov-c" cx="${B.x}" cy="${B.y}" r="3"/>`;
  s+=`<line class="${cls}" x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}"/>`+
     `<line class="${cls}" x1="${A.x-px}" y1="${A.y-py}" x2="${A.x+px}" y2="${A.y+py}"/>`+
     `<line class="${cls}" x1="${C.x-px}" y1="${C.y-py}" x2="${C.x+px}" y2="${C.y+py}"/>`+
     `<circle class="ov-d" cx="${A.x}" cy="${A.y}" r="4.5"/><circle class="ov-d" cx="${C.x}" cy="${C.y}" r="4.5"/>`;
  return {svg:s,ok:true,mx:(A.x+C.x)/2,my:(A.y+C.y)/2};
}
function drawOverlay(){
  let svg='';
  S.measures.forEach(m=>{
    const r=dimSvg(m,'ov-l');
    if(!r.ok){m.label.hidden=true;return;}
    m.label.hidden=false;svg+=r.svg;
    m.label.style.transform=`translate(${r.mx}px,${r.my}px) translate(-50%,-50%)`;
    m.label.innerHTML=`<small style="margin:0 5px 0 0">${m.tag}</small>${fmtLen(m.len)}<small>mm</small>`;
  });
  const hl=$('#hoverLbl');
  if(S.pending){
    const P=project(S.pending.p);
    if(P.ok)svg+=`<circle class="ov-r" cx="${P.x}" cy="${P.y}" r="7"/><circle class="ov-c" cx="${P.x}" cy="${P.y}" r="2.5"/>`;
    if(S.hover){
      const m=dimFrom(S.pending,S.hover),r=dimSvg(m,'ov-p');
      if(r.ok){svg+=r.svg;hl.hidden=false;hl.style.transform=`translate(${r.mx}px,${r.my}px) translate(-50%,-50%)`;hl.innerHTML=`<small style="margin:0 5px 0 0">${m.tag}</small>${fmtLen(m.len)}<small>mm</small>`;}
      else hl.hidden=true;
    }else hl.hidden=true;
  }else hl.hidden=true;
  ovSvg.innerHTML=svg;
}

/* ---------- seçme ışını ---------- */
const ray=new THREE.Raycaster();
function pick(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const dir=ray.ray.direction;
  const hits=ray.intersectObjects(S.meshes,false);
  for(const h of hits){
    if(!shown(h.object)||h.object.userData.ghost)continue;
    if(isClipped(h.point))continue;
    const n=h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):dir.clone().negate();
    if(n.dot(dir)>0&&S.planes.length){
      // arka yüze çarptı: ekranda görünen kırmızı kesit dolgusu; gerçek nokta kesit düzleminin üstünde
      let best=null,bd=-1;
      for(const pl of S.planes){
        const p=ray.ray.intersectPlane(pl,new V3());if(!p)continue;
        const d=p.distanceTo(ray.ray.origin);
        if(d<=h.distance+S.size*1e-6&&d>bd&&!isClipped(p)){bd=d;best={p,pl};}
      }
      if(best)return {point:best.p,normal:best.pl.normal.clone().negate(),object:h.object,face:null,cap:true};
    }
    if(n.dot(dir)>0)n.negate();
    return {point:h.point,normal:n,object:h.object,face:h.face,cap:false};
  }
  return null;
}
function snapPoint(h,cx,cy){
  const base={p:h.point.clone(),n:h.normal,snapped:false};
  if(!S.snap||!h.face)return base;
  const pos=h.object.geometry.attributes.position,r=renderer.domElement.getBoundingClientRect();
  let best=null,bd=18;
  [h.face.a,h.face.b,h.face.c].forEach(i=>{
    const w=new V3().fromBufferAttribute(pos,i).applyMatrix4(h.object.matrixWorld);
    if(isClipped(w))return;
    const s=project(w);const d=Math.hypot(s.x+r.left-cx,s.y+r.top-cy);
    if(d<bd){bd=d;best=w;}
  });
  return best?{p:best,n:h.normal,snapped:true}:base;
}

/* ---------- dokunma algılama ---------- */
const ptrs=new Map();let tapCand=null,lastTap=null,hoverReq=null;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,true);
  tapCand=ptrs.size===1?{id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now()}:null;
});
cv.addEventListener('pointermove',e=>{
  if(tapCand&&e.pointerId===tapCand.id&&Math.hypot(e.clientX-tapCand.x,e.clientY-tapCand.y)>8)tapCand=null;
  // farede ikinci noktanın önizlemesi
  if(S.mode==='measure'&&S.pending&&e.pointerType==='mouse'&&!e.buttons){
    hoverReq={x:e.clientX,y:e.clientY};
  }
});
cv.addEventListener('pointerleave',()=>{if(S.hover){S.hover=null;drawOverlay();}});
function stepHover(){
  if(!hoverReq)return;
  const {x,y}=hoverReq;hoverReq=null;
  const h=pick(x,y);S.hover=h?snapPoint(h,x,y):null;drawOverlay();
}
const endPtr=e=>{
  ptrs.delete(e.pointerId);
  if(e.type==='pointerup'&&tapCand&&e.pointerId===tapCand.id&&performance.now()-tapCand.t<450)onTap(e.clientX,e.clientY);
  tapCand=null;
};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);

function onTap(x,y){
  const now=performance.now();
  const dbl=lastTap&&now-lastTap.t<320&&Math.hypot(x-lastTap.x,y-lastTap.y)<24;
  lastTap=dbl?null:{t:now,x,y};
  const h=pick(x,y);
  if(S.mode==='measure'){
    if(!h)return;
    const sp=snapPoint(h,x,y);
    if(!S.pending){S.pending=sp;S.hover=null;}
    else addMeasure(S.pending,sp);
    if(S.mode==='measure')renderCard();
    drawOverlay();dirty=true;return;
  }
  if(dbl){if(h)setPivot(h.point);return;}
  if(!h){select(null);return;}
  let it=itemOf(h.object);
  // aynı parçaya tekrar dokunuş: bir üst gruba çık
  if(S.sel&&it&&isAncestor(S.sel.obj,it.obj)){
    const up=S.sel.parent;it=(up&&up!==S.rootItem)?up:it;
  }
  if(S.mode!=='select')setMode('select');
  select(it);
}
// Çift dokunuş: dönme merkezini dokunulan noktaya al (yakınlaşma oraya doğru olur)
function setPivot(p){

let tween=null;
const DIRS={iso:new V3(1,0.8,1.15),front:new V3(0,0,1),back:new V3(0,0,-1),right:new V3(1,0,0),left:new V3(-1,0,0),top:new V3(0,1,0.0001)};
function visibleBox(){const b=new THREE.Box3();S.meshes.forEach(m=>{if(shown(m))b.expandByObject(m);});return b.isEmpty()?S.box.clone():b;}
function frame(box,dir,instant){
  const c=box.getCenter(new V3());const r=Math.max(box.getSize(new V3()).length()/2,S.size/400);
  const fov=THREE.MathUtils.degToRad(persp.fov);const vf=Math.min(fov,2*Math.atan(Math.tan(fov/2)*persp.aspect));
  const dist=r/Math.sin(vf/2)*1.02;
  const d=(dir||camera.position.clone().sub(controls.target)).clone().normalize();
  const toP=c.clone().addScaledVector(d,dist);
  const toH=r*2.1/Math.min(1,persp.aspect);
  if(instant){controls.target.copy(c);camera.position.copy(toP);if(camera===ortho){S.orthoH=toH;ortho.zoom=1;updateOrtho();}controls.update();dirty=true;return;}
  tween={t0:performance.now(),fT:controls.target.clone(),fP:camera.position.clone(),tT:c,tP:toP,fH:S.orthoH/(camera===ortho?ortho.zoom:1),tH:toH};
}
function setView(name,instant){
  if(name==='fit')frame(visibleBox(),null,instant);
  else frame(visibleBox(),DIRS[name],instant);
}
function focusItem(it){if(it)frame(itemBox(it),null);}
function stepTween(now){
  const k=Math.min(1,(now-tween.t0)/380),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  controls.target.lerpVectors(tween.fT,tween.tT,e);camera.position.lerpVectors(tween.fP,tween.tP,e);
  if(camera===ortho){S.orthoH=tween.fH+(tween.tH-tween.fH)*e;ortho.zoom=1;updateOrtho();}
  if(k>=1)tween=null;dirty=true;
}
function setOrtho(on){
  const t=controls.target.clone();
  if(on&&camera!==ortho){
    const dist=persp.position.distanceTo(t);
    S.orthoH=2*dist*Math.tan(THREE.MathUtils.degToRad(persp.fov/2));
    ortho.position.copy(persp.position);ortho.quaternion.copy(persp.quaternion);ortho.zoom=1;updateOrtho();camera=ortho;
  }else if(!on&&camera===ortho){
    const H=S.orthoH/ortho.zoom;const dist=H/(2*Math.tan(THREE.MathUtils.degToRad(persp.fov/2)));
    const d=ortho.position.clone().sub(t).normalize();persp.position.copy(t).addScaledVector(d,dist);camera=persp;
  }
  controls.object=camera;controls.update();$('#btnOrtho').classList.toggle('on',camera===ortho);dirty=true;
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

// Hareket sırasında (döndürme, yakınlaşma, kesit kaydırma) düşük çözünürlükte çiz, durunca keskinleştir
const DPR_HI=Math.min(window.devicePixelRatio||1,1.75);

function loop(now){
  requestAnimationFrame(loop);
  let moving=false;
  if(tween){stepTween(now);moving=true;}
  if(controls.update())moving=true;
  if(moving)markMoving();
  else if(lowRes&&now-lastMove>200){lowRes=false;renderer.setPixelRatio(DPR_HI);dirty=true;}
  stepBlink(now);
  stepHover();
  if(!dirty)return;dirty=false;
  key.position.copy(camera.position).add(new V3(0,S.size*0.3,0));key.target.position.copy(controls.target);

/* ---------- yükleme ---------- */
const DRACO_URL='https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/draco/gltf/draco_decoder.js';
const draco=new THREE.DRACOLoader();
draco.setDecoderConfig({type:'js'});
// Kod çözücü ana sayfaya script olarak yüklenir, kaynağı worker'a metin olarak aktarılır
draco._loadLibrary=function(){
  return ensureScript(DRACO_URL,'DracoDecoderModule').then(()=>'var _scriptDir;\nvar DracoDecoderModule='+window.DracoDecoderModule.toString()+';');
};
// Worker çökerse bekleyen işler reddedilsin, yükleme sonsuza kadar asılı kalmasın
const ogGetWorker=draco._getWorker.bind(draco);
draco._getWorker=function(id,cost){
  return ogGetWorker(id,cost).then(w=>{
    if(!w._kmHooked){w._kmHooked=true;w.addEventListener('error',ev=>{
      try{ev.preventDefault();}catch(e){}
      Object.values(w._callbacks||{}).forEach(c=>c.reject(new Error('Draco çözücü hatası: '+(ev.message||'bilinmiyor'))));
    });}
    return w;
  });
};
const scriptCache={};
function ensureScript(src,globalName){
  if(window[globalName])return Promise.resolve();
  if(scriptCache[src])return scriptCache[src];
  return scriptCache[src]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;s.async=true;
    s.onload=()=>window[globalName]?res():rej(new Error(globalName+' yüklenemedi'));
    s.onerror=()=>{delete scriptCache[src];rej(new Error('Draco çözücü indirilemedi'));};
    document.head.appendChild(s);
  });
}

function makeLoader(manager){
  const l=new THREE.GLTFLoader(manager);
  l.setDRACOLoader(draco);
  if(window.MeshoptDecoder)l.setMeshoptDecoder(window.MeshoptDecoder);
  return l;
}
// GLB/GLTF içindeki JSON'dan kullanılan uzantıları oku
function gltfExtensions(buf){
  try{
    const dv=new DataView(buf);let json;
    if(dv.getUint32(0,true)===0x46546C67){const len=dv.getUint32(12,true);json=new TextDecoder().decode(new Uint8Array(buf,20,len));}
    else json=new TextDecoder().decode(new Uint8Array(buf));
    const j=JSON.parse(json);return (j.extensionsUsed||[]).concat(j.extensionsRequired||[]);
  }catch(e){return [];}
}
let loadSeq=0;
function loadFiles(files){
  files=[...files];
  const main=files.find(f=>/\.(glb|gltf)$/i.test(f.name));
  if(!main){toast('GLB veya GLTF dosyası seçin.');return;}
  const id=++loadSeq;
  const fail=msg=>{if(id!==loadSeq)return;busy();toast(msg);};
  busy(`${main.name} okunuyor…`,true);
  const urls={};files.forEach(f=>urls[f.name]=URL.createObjectURL(f));
  const manager=new THREE.LoadingManager();
  manager.setURLModifier(u=>{const n=decodeURIComponent(u.split('/').pop());return urls[n]||u;});
  const rd=new FileReader();
  rd.onload=()=>{
    if(id!==loadSeq)return;
    const ext=gltfExtensions(rd.result);
    const usesDraco=ext.includes('KHR_draco_mesh_compression');
    const usesMeshopt=ext.includes('EXT_meshopt_compression');
    if(usesMeshopt&&!window.MeshoptDecoder){fail('Bu model meshopt ile sıkıştırılmış ve çözücü yüklenemedi. Sıkıştırmasız veya Draco ile dışa aktarın.');return;}
    busy(usesDraco?'Draco sıkıştırması çözülüyor…':'Model okunuyor…',true);
    const prep=usesDraco?ensureScript(DRACO_URL,'DracoDecoderModule'):Promise.resolve();
    prep.then(()=>{
      if(id!==loadSeq)return;
      makeLoader(manager).parse(rd.result,'',gltf=>{
        if(id!==loadSeq)return;
        busy('Sahne kuruluyor…',true);
        setTimeout(()=>{
          if(id!==loadSeq)return;
          try{
            const sc=gltf.scene||gltf.scenes[0];sc.name=sc.name||main.name;
            setModel(sc,main.name);toast(`${main.name} yüklendi`);
          }catch(err){console.error(err);toast('Model kurulurken hata: '+(err&&err.message||err));}
          finally{busy();}
        },20);
      },err=>{console.error(err);fail(loadErr(err));});
    }).catch(err=>{console.error(err);fail(loadErr(err));});
  };
  rd.onerror=()=>fail('Dosya okunamadı. Tekrar seçmeyi deneyin.');
  rd.readAsArrayBuffer(main);
}
function cancelLoad(){loadSeq++;busy();toast('Yükleme iptal edildi.');}
window.addEventListener('unhandledrejection',e=>{if(!$('#busy').hidden){busy();toast('Model açılamadı: '+((e.reason&&e.reason.message)||e.reason));}});
window.addEventListener('error',e=>{if(!$('#busy').hidden&&e.message){busy();toast('Hata: '+e.message);}});
function loadErr(err){
  const m=String(err&&err.message||err);
  if(/meshopt/i.test(m))return 'Bu model meshopt ile sıkıştırılmış ve kod çözücü yüklenemedi. Sıkıştırmasız veya Draco ile dışa aktarın.';
  if(/draco/i.test(m))return 'Draco kod çözücü yüklenemedi. İnternet bağlantısını kontrol edin ya da sıkıştırmasız GLB deneyin.';
  return 'Model açılamadı: '+m;
}
$('#fileIn').onchange=e=>{if(e.target.files.length)loadFiles(e.target.files);e.target.value='';};
var dragN=0;
const isFileDrag=e=>!!(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files'));
const hideDrop=()=>{dragN=0;$('#drop').hidden=true;};
view.addEventListener('dragenter',e=>{if(!isFileDrag(e))return;e.preventDefault();dragN++;if($('#busy').hidden)$('#drop').hidden=false;});
view.addEventListener('dragover',e=>{if(isFileDrag(e))e.preventDefault();});
view.addEventListener('dragleave',e=>{if(!isFileDrag(e))return;if(--dragN<=0)hideDrop();});
view.addEventListener('drop',e=>{e.preventDefault();hideDrop();if(e.dataTransfer.files.length)loadFiles(e.dataTransfer.files);});
// sayfanın başka yerine bırakılırsa ya da sürükleme iptal edilirse çerçeve kapansın
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();hideDrop();});
window.addEventListener('dragend',hideDrop);
window.addEventListener('pointerdown',hideDrop,true);

// GitHub Pages gibi kendi sitenizde: ?model=dosya.glb ile açılır
function tryUrlModel(){
  let u=null;try{u=new URLSearchParams(location.search).get('model');}catch(e){}
  if(!u)return false;
  busy('Model indiriliyor…');
  makeLoader().load(u,gltf=>{setModel(gltf.scene,u.split('/').pop());busy();},
    x=>{if(x.total)busy(`Model indiriliyor… %${Math.round(x.loaded/x.total*100)}`);},
    err=>{busy();toast('Model indirilemedi: '+u);buildSample();});
  return true;

function buildSample(){
  const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:0},o));
  const oak=M('#b98a58'),white=M('#ecebe6',{roughness:.45}),fabric=M('#7d8a8f',{roughness:.95}),wall=M('#d4d0c8',{roughness:.9}),floor=M('#8e7a63'),metal=M('#9aa3a8',{metalness:.8,roughness:.3}),lining=M('#c9b9a2');
  const root=new THREE.Group();root.name='NB84_Misafir_Kabin';
  const grp=(n,p,pos=[0,0,0])=>{const g=new THREE.Group();g.name=n;g.position.set(...pos);(p||root).add(g);return g;};
  const box=(n,p,w,h,d,x,y,z,m)=>{const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.name=n;me.position.set(x+w/2,y+h/2,z+d/2);p.add(me);return me;};
  // kabin gövdesi (ölçüler metre)
  const hull=grp('Kabin_Govde');
  box('Doseme',hull,3.2,0.04,3.0,0,-0.04,0,floor);

/* ---------- yardımcılar ---------- */
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3800);}
let busyT0=0,busyTick=null,busyMsg='';
function busy(t,cancelable){
  const el=$('#busy');el.hidden=!t;$('#drop').hidden=true;dragN=0;
  clearInterval(busyTick);busyTick=null;
  if(!t)return;
  if(busyMsg!==t||!busyT0)busyT0=performance.now();busyMsg=t;
  $('#busyCancel').hidden=!cancelable;
  const draw=()=>{const s=Math.round((performance.now()-busyT0)/1000);$('#busyTxt').textContent=t+(s>=3?` (${s} sn)`:'');};
  draw();if(cancelable)busyTick=setInterval(draw,1000);
}
$('#busyCancel').onclick=cancelLoad;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtInt(n){return Math.round(n).toLocaleString('tr-TR');}
function toggleDrawer(force){const d=$('#drawer');const open=force===undefined?d.classList.contains('closed'):force;d.classList.toggle('closed',!open);setTimeout(resize,220);}
$('#btnTree').onclick=()=>toggleDrawer();
$('#btnShowAll').onclick=showAll;
$('#btnUndo').onclick=undo;
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='Escape'){if(S.pending){S.pending=null;drawOverlay();}else select(null);}
  if(e.key==='h'&&S.sel)hideItem(S.sel);
  if(e.key==='i'&&S.sel)isolate(S.sel);
  if(e.key==='f')S.sel?focusItem(S.sel):setView('fit');
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
});
const mq=matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener&&mq.addEventListener('change',readTokens);
new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- başlat ---------- */
if(window.innerWidth<=760)$('#drawer').classList.add('closed');
readTokens();resize();
if(!tryUrlModel())buildSample();
})();
