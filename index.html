<style>

:root{--navy:#0f1b2d;--ink:#1c2430;--mut:#5b6676;--line:#e1e6ee;--stage:#eef0f3;--bar:#2b323c;--blue:#1a64d6;--orange:#ff7a1a;--red:#d61f1f;color-scheme:light}

#tb button.on{background:#3d4858;box-shadow:inset 0 -3px #4aa3ff;color:#fff}

#exb{position:absolute;left:0;right:0;bottom:52px;height:44px;background:#fffffff0;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:3;font-size:13px}#exb input{flex:1;min-width:0;touch-action:none}#exb button{padding:5px 8px;font-size:12px;white-space:nowrap}

#pen{position:absolute;inset:0;z-index:2;display:none;touch-action:none;cursor:crosshair}

.row2{display:flex;align-items:center;min-height:38px;padding-left:calc(2px + var(--d,0) * 14px);padding-right:4px;border-left:4px solid transparent;border-bottom:1px solid #f1f3f6;cursor:pointer}

.kids[hidden]{display:none}
.ov{position:fixed;inset:0;background:#000d;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}
#busy{position:absolute;inset:0;display:grid;place-items:center;background:#eef0f3b0;z-index:8}
.bbox{background:#fff;border-radius:12px;padding:12px 12px 12px 18px;box-shadow:0 2px 14px #0003;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px)}

#pkp{display:none}
@media print{body.pp>*:not(#pkp){display:none!important}#pkp{display:block!important;background:#fff}}
@media (max-width:700px){#logo small,#fi span{display:none}#hd{gap:10px;padding:6px 10px}#tb button{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

(function loop(){requestAnimationFrame(loop);if(!stage.clientWidth)return;const now=performance.now(),pulse=sel.length>0;

/* ---- model kurulumu ---- */
function boot(root,label){
 resetTools();
 if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh||o.isLineSegments)o.geometry.dispose()});MATS.forEach(m=>m.dispose());MATS.clear();HL_MATS.clear();matCache=new Map()}
 parts={};sel=[];selItem=null;allMeshes=[];hid.clear();gho.clear();HIST.length=0;TRIS=0;$('#ex').value=0;exv=0;
 model=new THREE.Group();model.add(root);scene.add(model);
 const b=new THREE.Box3().setFromObject(model),M=Math.max(...b.getSize(new V3()).toArray())||1;F=M<20?1000:1;sc=1/M;model.scale.setScalar(sc);model.updateMatrixWorld(true);
 model.position.sub(new THREE.Box3().setFromObject(model).getCenter(new V3()));model.updateMatrixWorld(true);BB=new THREE.Box3().setFromObject(model);
 buildItems(root);
 root.traverse(o=>{if(!o.isMesh)return;const g=o.geometry;if(!g.attributes.normal)g.computeVertexNormals();
  o.material=Array.isArray(o.material)?o.material.map(prepMat):prepMat(o.material);o.userData.baseMat=o.material;
  TRIS+=(g.index?g.index.count:g.attributes.position.count)/3;allMeshes.push(o);o.userData.w0=o.getWorldPosition(new V3());o.userData.wbox=null;o.userData.wp=null});
 let n=0;ITEMS.forEach(it=>{if(it.children.length)return;const k='p'+(n++);it.key=k;const ms=[];it.obj.traverse(x=>{if(x.isMesh){ms.push(x);x.userData.k=k}});parts[k]={name:it.name,meshes:ms,item:it}});
 allMeshes.forEach(m=>{if(!m.userData.k||!parts[m.userData.k]){const k='p'+(n++);parts[k]={name:niceName(m),meshes:[m]};m.userData.k=k}});
 buildFurn();for(const p of Object.values(parts)){const bb=new THREE.Box3();p.meshes.forEach(m=>bb.expandByObject(m));p.bb=bb.clone();p.dir=bb.getCenter(new V3()).normalize();p.dim=bb.getSize(new V3()).toArray().map(v=>Math.round(v/sc*F)).sort((a,b)=>b-a)}
 pl.forEach(q=>{q.on=false;q.s=1;q.v=0});ap=2;olSlow=false;
 ctl.target.set(0,0,0);cam.position.set(1.2,.8,1.6);
 $('#fi').innerHTML=`<b>${esc(label)}</b><span>${Object.keys(parts).length} parça · ${Math.round(TRIS).toLocaleString('tr-TR')} üçgen</span>`;
 $('#q').value='';renderTree();applyCut();applyVis();info();dirty=true}

/* ---- yükleme ---- */
const DRACO_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/draco_decoder.js';
const scriptCache={};
function ensureScript(src,g){if(window[g])return Promise.resolve();if(scriptCache[src])return scriptCache[src];
 return scriptCache[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>window[g]?res():rej(new Error(g+' yüklenemedi'));s.onerror=()=>{delete scriptCache[src];rej(new Error('Draco çözücü indirilemedi'))};document.head.appendChild(s)})}
const draco=new DRACOLoader();draco.setDecoderConfig({type:'js'});
// çözücü ana sayfaya script olarak yüklenir, kaynağı worker'a metin olarak verilir (sayfanın dış adrese fetch yapamadığı ortamlarda da çalışır)
draco._loadLibrary=()=>ensureScript(DRACO_URL,'DracoDecoderModule').then(()=>'var _scriptDir;\nvar DracoDecoderModule='+window.DracoDecoderModule.toString()+';');
const ogW=draco._getWorker.bind(draco);
draco._getWorker=(id,c)=>ogW(id,c).then(w=>{if(!w._hk){w._hk=1;w.addEventListener('error',ev=>{try{ev.preventDefault()}catch{}Object.values(w._callbacks||{}).forEach(cb=>cb.reject(new Error('Draco çözücü hatası')))})}return w});
const mkLoader=mgr=>{const l=new GLTFLoader(mgr);l.setDRACOLoader(draco);l.setMeshoptDecoder(MeshoptDecoder);return l};
function gltfExt(buf){try{const dv=new DataView(buf);let j;if(dv.getUint32(0,true)===0x46546C67)j=new TextDecoder().decode(new Uint8Array(buf,20,dv.getUint32(12,true)));else j=new TextDecoder().decode(new Uint8Array(buf));j=JSON.parse(j);return(j.extensionsUsed||[])}catch{return[]}}
let loadSeq=0,busyT0=0,busyTick=null;
function busy(t,c){$('#busy').hidden=!t;$('#drop').hidden=true;clearInterval(busyTick);if(!t){busyT0=0;return}if(!busyT0)busyT0=performance.now();$('#busyCancel').hidden=!c;
 const d=()=>{const s=Math.round((performance.now()-busyT0)/1000);$('#busyTxt').textContent=t+(s>=3?` (${s} sn)`:'')};d();busyTick=setInterval(d,1000)}
$('#busyCancel').onclick=()=>{loadSeq++;busy();toast('Yükleme iptal edildi')};
function loadFiles(files){files=[...files];const main=files.find(f=>/\.(glb|gltf)$/i.test(f.name));if(!main)return toast('GLB veya GLTF dosyası seçin.');
 const id=++loadSeq,fail=m=>{if(id!==loadSeq)return;busy();toast(m)};busy(main.name+' okunuyor…',true);
 const urls={};files.forEach(f=>urls[f.name]=URL.createObjectURL(f));const mgr=new THREE.LoadingManager();mgr.setURLModifier(u=>urls[decodeURIComponent(u.split('/').pop())]||u);
 const rd=new FileReader();rd.onerror=()=>fail('Dosya okunamadı.');
 rd.onload=()=>{if(id!==loadSeq)return;const ex=gltfExt(rd.result),dr=ex.includes('KHR_draco_mesh_compression');busy(dr?'Draco sıkıştırması çözülüyor…':'Model okunuyor…',true);
  (dr?ensureScript(DRACO_URL,'DracoDecoderModule'):Promise.resolve()).then(()=>{if(id!==loadSeq)return;
   mkLoader(mgr).parse(rd.result,'',g=>{if(id!==loadSeq)return;busy('Sahne kuruluyor…',true);setTimeout(()=>{if(id!==loadSeq)return;try{boot(g.scene||g.scenes[0],main.name);toast(main.name+' yüklendi')}catch(e){console.error(e);toast('Model kurulurken hata: '+(e.message||e))}finally{busy()}},20)},e=>{console.error(e);fail('Model açılamadı: '+(e.message||e))})}).catch(e=>fail('Model açılamadı: '+(e.message||e)))};
 rd.readAsArrayBuffer(main)}
$('#fileIn').onchange=e=>{if(e.target.files.length)loadFiles(e.target.files);e.target.value=''};
let dragN=0;const isF=e=>[...(e.dataTransfer?.types||[])].includes('Files'),hideDrop=()=>{dragN=0;$('#drop').hidden=true};
stage.addEventListener('dragenter',e=>{if(!isF(e))return;e.preventDefault();dragN++;if($('#busy').hidden)$('#drop').hidden=false});
stage.addEventListener('dragover',e=>{if(isF(e))e.preventDefault()});
stage.addEventListener('dragleave',e=>{if(isF(e)&&--dragN<=0)hideDrop()});
stage.addEventListener('drop',e=>{e.preventDefault();hideDrop();if(e.dataTransfer.files.length)loadFiles(e.dataTransfer.files)});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();hideDrop()});addEventListener('dragend',hideDrop);addEventListener('pointerdown',hideDrop,true);
addEventListener('unhandledrejection',e=>{if(!$('#busy').hidden){busy();toast('Model açılamadı: '+(e.reason?.message||e.reason))}});
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3800)}
$('#fs').onclick=()=>{const on=!document.fullscreenElement;try{on?document.documentElement.requestFullscreen().catch(()=>{}):document.exitFullscreen()}catch{}};
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key=='Escape')selectItem(null);if(e.key=='h'&&sel.length)$('#aH').click();if(e.key=='f')focus(sel)});
